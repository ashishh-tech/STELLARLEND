<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="stellarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    
    <linearGradient id="shieldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#glow)" />

  <!-- Logo Mark Group -->
  <g transform="translate(10, 10)">
    <!-- Outer Shield / Orbital Arc -->
    <path d="M 20 60 A 40 40 0 1 1 90 85" fill="none" stroke="url(#stellarGrad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="160" stroke-dashoffset="10" filter="url(#neonGlow)" />
    
    <!-- Dynamic Growth Arrow Arc -->
    <path d="M 15 75 C 30 95, 75 95, 92 68" fill="none" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- Central Stellar 4-Point Star -->
    <path d="M 50 15 Q 50 50 15 50 Q 50 50 50 85 Q 50 50 85 50 Q 50 50 50 15 Z" fill="url(#stellarGrad)" filter="url(#neonGlow)" />
    
    <!-- Inner Core Sparkle -->
    <circle cx="50" cy="50" r="6" fill="#FFFFFF" />
    <path d="M 50 38 L 50 62 M 38 50 L 62 50" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 72)">
    <!-- "Stellar" -->
    <text font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="-0.5">Stellar</text>
    <!-- "Lend" with Gradient -->
    <text x="142" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif" font-weight="800" font-size="44" fill="url(#textGrad)" letter-spacing="-0.5">Lend</text>
    <!-- Tagline / Subtitle -->
    <text x="2" y="24" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="3.5" opacity="0.85">DEFI PROTOCOL</text>
  </g>
</svg>
